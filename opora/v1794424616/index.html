<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Личное · Точка опоры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: одноколоночное приложение с нижней навигацией. Сверху «пульт дня» (кольцо + качества), ниже вечерний чек-ин сверху вниз. Шесть качеств — шесть цветов, это единственное яркое в интерфейсе. */
:root{
  --bg:#ECF0EE;--card:#FFFFFF;--ink:#14201C;--mute:#566660;--line:#D5DEDA;--soft:#E1EAE6;
  --acc:#17654F;--acc-ink:#FFFFFF;--ok:#23855A;--ok-soft:#D9EFE3;--warn:#AE7118;--warn-soft:#F5E9D0;--danger:#B3432E;
  --base:#C4CFC9;--sheet:rgba(12,22,18,.5);--hero:#14201C;--hero-ink:#EEF4F1;--hero-mute:#9FB2AA;
  --qD:#3552D4;--qB:#D65536;--qE:#C78B06;--qP:#0F8A83;--qA:#7A4FC0;--qC:#2B8F47;
  --f-disp:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1311;--card:#151E1B;--ink:#E3ECE8;--mute:#8FA199;--line:#25312D;--soft:#1C2824;--acc:#5BC29C;--acc-ink:#08120E;--ok:#56C98B;--ok-soft:#18311F;--warn:#E0A548;--warn-soft:#372B15;--danger:#E27560;--base:#33413B;--sheet:rgba(0,0,0,.62);--hero:#1B2622;--hero-ink:#EEF4F1;--hero-mute:#9FB2AA;--qD:#8398FF;--qB:#FF8C6E;--qE:#F4BF45;--qP:#4FD3C7;--qA:#B79EFF;--qC:#6DD78D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1311;--card:#151E1B;--ink:#E3ECE8;--mute:#8FA199;--line:#25312D;--soft:#1C2824;--acc:#5BC29C;--acc-ink:#08120E;--ok:#56C98B;--ok-soft:#18311F;--warn:#E0A548;--warn-soft:#372B15;--danger:#E27560;--base:#33413B;--sheet:rgba(0,0,0,.62);--hero:#1B2622;--hero-ink:#EEF4F1;--hero-mute:#9FB2AA;--qD:#8398FF;--qB:#FF8C6E;--qE:#F4BF45;--qP:#4FD3C7;--qA:#B79EFF;--qC:#6DD78D;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
main{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 110px}
h1{font:700 22px/1.2 var(--f-disp);margin:2px 0 0;text-wrap:balance}
h2{font:600 12px/1.2 var(--f-body);margin:28px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
h3{font:600 18px/1.3 var(--f-disp);margin:2px 0 6px;text-wrap:balance}
p{margin:6px 0}
.eyebrow{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.date{display:flex;gap:6px}
.date button{width:40px;height:40px;padding:0;font-size:18px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-top:8px;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--mute)}
.sync.ok{background:var(--ok-soft);color:var(--ok)}
.sync.err{background:var(--warn-soft);color:var(--danger)}
.step{display:flex;align-items:center;gap:10px;margin:26px 0 8px}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-disp);background:var(--acc);color:var(--acc-ink);flex:none}
.step .n.done{background:var(--ok)}
.step b{font:600 16px var(--f-disp)}
.step span{font-size:13px;color:var(--mute)}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;transition:transform .12s}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,[role=checkbox]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:active{transform:scale(.96)}
button:disabled{opacity:.35;cursor:default}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.link{background:none;border:0;padding:4px 0;color:var(--acc);font-weight:600}
button.wide{width:100%;padding:15px;font-size:17px;border-radius:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.focus{background:var(--soft);border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.wrap{flex-wrap:wrap}
.mute{color:var(--mute)}
.small{font-size:14px}
.tiny{font-size:12px}
.grid2,.grid3{display:grid;gap:10px}
.grid2{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:repeat(3,1fr)}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);min-width:0}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.lbl{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:6px 12px;font-size:14px;text-align:left;line-height:1.3}
.picks{display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.35}
.pick::before{content:"+";font-weight:700;color:var(--acc);flex:none;width:14px}
.pick.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.pick.on::before{content:"✓";color:inherit}
.pick.one::before{content:"○"}.pick.one.on::before{content:"●"}
.seg.more{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
.seg.more.end{-webkit-mask-image:none;mask-image:none}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip.bad.on{background:var(--warn);border-color:var(--warn);color:#fff}
.scale{display:flex;gap:6px}
.scale button{flex:1;padding:9px 0;min-width:0}
.scale button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}

/* пульт дня */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:12px}
.hero .ring text{fill:var(--hero-ink)}
.hero .mute{color:var(--hero-mute)}
.hero .big-n{font:700 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.qrow{display:flex;flex-wrap:wrap;gap:6px}
.q{--c:var(--acc);display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:13px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.q::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.hero .q{background:color-mix(in srgb,var(--c) 22%,transparent)}
.qdots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}
.qdots i{width:7px;height:7px;border-radius:50%;background:var(--c)}

.check{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check.tap{cursor:pointer}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px;color:#fff;margin-top:1px}
.box.on{background:var(--ok);border-color:var(--ok);animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;background:var(--acc);color:var(--acc-ink)}
.tag.old{background:var(--soft);color:var(--mute)}
.hab-wrap{border-bottom:1px solid var(--line)}
.hab-wrap:last-child{border:0}
.hab{display:flex;align-items:center;gap:10px;padding:8px 0}
.tot{font:700 20px var(--f-disp);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:0 0 10px}
@media (max-width:460px){.parts{grid-template-columns:1fr}}
.part{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--bg);border-radius:10px;padding:3px 3px 3px 10px;min-width:0}
.part.on{background:var(--warn-soft)}
.cnt.sm button{width:32px;height:32px;font-size:17px}
.cnt.sm output{min-width:24px;font-size:16px}
.estp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.estp{grid-template-columns:1fr}}
.hab .n{flex:1;min-width:0}
.hab .n b{display:block;font-weight:600}
.hab.over .n b{color:var(--warn)}
.cnt{display:flex;align-items:center;gap:6px}
.cnt button{width:38px;height:38px;padding:0;font-size:20px}
.cnt output{min-width:34px;text-align:center;font:600 18px var(--f-body);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.over{background:var(--warn-soft);color:var(--warn)}
.it{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px}
.focus .it{background:var(--card)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);border-radius:14px;padding:12px 14px;margin-top:10px}
.banner.calm{background:var(--soft)}
.todo .banner{margin-top:0;padding:10px 12px;border-radius:12px;background:var(--bg)}.todo .alert{margin-top:0!important}
.alert{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--danger);border-radius:8px;padding:8px 10px;font-size:14px}
details.fold>summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
.vcard>summary::-webkit-details-marker{display:none}.vcard>summary::after{content:" ›";opacity:.5}.vcard[open]>summary::after{content:" ⌄"}
details.fold[open]>summary{margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:680px;margin:0 auto}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:0;background:none;padding:8px 2px 7px;color:var(--mute);font:500 11px/1.1 var(--f-body);min-width:0;min-height:54px}
nav button span{max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);font-weight:700}
nav button.on svg{stroke-width:2.3}
nav button.crave{color:var(--acc);background:color-mix(in srgb,var(--acc) 13%,transparent);border-radius:14px;margin:3px 3px 3px 5px;min-height:48px}
nav button.crave span{font-weight:700}
body.kb nav{display:none}
.ypbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:648px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.14);z-index:4;text-align:left}
.ypbar:active{transform:translateX(-50%) scale(.98)}
.ypbar span:first-child{flex:none}.ypbar span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.kb .ypbar{display:none}
.pday{border-left:4px solid var(--acc)}
@media (max-width:340px){nav button{font-size:10px}}
.urge{display:none;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:12px 18px;background:var(--hero);color:var(--hero-ink);border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:4;font-weight:600}
.shade{position:fixed;inset:0;background:var(--sheet);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:680px;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--acc));border-radius:5px}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--ok)}
.steps i.now{background:var(--acc)}
details.stage{background:var(--card);border:1px solid var(--line);border-radius:18px}
details.stage>summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center}
details.stage>summary::-webkit-details-marker{display:none}
details.stage .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-disp);flex:none;background:var(--soft);color:var(--mute)}
.num.done{background:var(--ok);color:#fff}
.num.now{background:var(--acc);color:var(--acc-ink)}
.sub{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
ul.sw{list-style:none;padding:0;margin:0}
ul.sw li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
ul.sw li:last-child{border:0}
ul.sw s{color:var(--mute)}
details.sci{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details.sci summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:10px}
details.sci summary span{font:700 13px var(--f-disp);color:var(--acc);white-space:nowrap}
details.sci p{color:var(--mute);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kpis.sm .kpi{padding:8px 10px;border-radius:14px}.kpis.sm .kpi b{font-size:19px;display:block;margin-top:2px}.kpis.sm .kpi span{display:block;line-height:1.2}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.kpi b{display:block;font:700 22px/1.3 var(--f-disp);font-variant-numeric:tabular-nums}
.cmp .b,.cmp .c{height:8px;border-radius:4px;margin-top:4px}
.cmp .b{background:var(--base)}
.cmp .c{background:var(--ok)}
.cmp .c.over{background:var(--warn)}
.cmp .c.acc{background:var(--acc)}
.ins{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ins:last-child{border:0}
.ins b{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
svg text{fill:var(--mute);font:11px var(--f-body)}
.big{font:700 44px var(--f-disp);text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:10;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--mute)}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qcard{min-width:0}.qcard b,.qcard .tiny{overflow-wrap:anywhere}
.qcard{--c:var(--acc);border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--c) 10%,var(--card));display:flex;flex-direction:column;gap:6px}
.qcard b{color:var(--c)}
.qcard .lv{font:700 20px var(--f-disp);color:var(--c)}
.radar-wrap{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:14px;align-items:center}
@media (max-width:520px){.radar-wrap{grid-template-columns:1fr}.radar-wrap svg{max-width:280px;margin:0 auto}}
/* разбор ИИ */
.ai{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ai .mute{color:var(--hero-mute)}
.ai .chip{background:transparent;color:var(--hero-ink);border-color:var(--hero-mute)}
.ai textarea{background:rgba(255,255,255,.06);color:var(--hero-ink);border-color:var(--hero-mute);min-height:52px}
.ai-out{background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
.ai-out .mute{color:var(--mute)}
.ai-hist{border-top:1px solid var(--line);padding:8px 0}
.ai-hist summary{cursor:pointer;font-size:14px}
/* iOS: поля даты и времени не вылезают из карточек */
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;max-width:100%;min-height:40px;height:40px;line-height:normal;text-align:left;display:block}
input[type=time]::-webkit-date-and-time-value,input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* разделы внутри вкладки */
.seg{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;gap:6px;padding:10px 0 8px;margin-top:6px;background:var(--bg);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 1 auto;white-space:nowrap;border-radius:999px;padding:9px 10px;font-weight:600;font-size:14px;color:var(--mute);background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.seg button .ok{width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:inline-grid;place-items:center;line-height:1}
.seg button.on .ok{background:var(--acc-ink);color:var(--acc)}
.seg-hint{margin:4px 0 8px;color:var(--mute);font-size:14px}
.tgl{flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;padding:0;border:0;transition:background .2s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.tgl[aria-checked=true]{background:var(--acc)}
.tgl[aria-checked=true]::after{transform:translateX(18px)}
.setrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.check.tap{transition:opacity .12s}.check.tap:active{opacity:.65}
details.fold>summary{min-height:36px;display:flex;align-items:center}
details.sci summary{align-items:baseline}
details.sci summary span{white-space:normal;text-align:right;max-width:46%}
/* состояния и рефлексия */
.fi{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:6px 8px}
.fi>span{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}

<script>/* бот-страница: база «Точка опоры» в Supabase через Edge Function — чтение и запись настоящие */
(function(){
var API="https://puduuhyeddxjmhiponxl.supabase.co/functions/v1/app";
var PAGE_VER="1794424616";
var D={},subs=[],cur=null,started=false,lastSig="";
var COLLS=["days","weeks","meta","labs","ai"];
function lockstat(t){try{var el=document.getElementById("lockstat");if(el)el.textContent=t}catch(e){}}
function ping(err){
  var msg="v"+PAGE_VER+" | auth:"+(isAuthed()?"да":"нет")+" | init:"+(tgInit()||"").length+(err?" | "+String(err).slice(0,90):"");
  try{lockstat(msg)}catch(e){}
  try{
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op:"ping",v:PAGE_VER,href:String(location.href).slice(0,180),
        authed:isAuthed(),initDataLen:(tgInit()||"").length,err:String(err||"").slice(0,200),
        init:String(tgInit()||"").slice(0,900)})})
      .then(function(r){try{lockstat(msg+" | отправлено")}catch(e){}})
      .catch(function(pe){try{lockstat(msg+" | НЕ ОТПРАВЛЕНО: "+String(pe).slice(0,60))}catch(e){}});
  }catch(e){}
}
window.tochkaPing=ping;
window.addEventListener("error",function(e){ping("JS: "+(e.message||e.type)+" @"+(e.filename||"").slice(-30)+":"+e.lineno)});
window.addEventListener("unhandledrejection",function(e){ping("Promise: "+String(e.reason&&e.reason.message||e.reason).slice(0,150))});
function tgInit(){
  try{if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData)return window.Telegram.WebApp.initData}catch(e){}
  var q=new URLSearchParams(location.search).get("tgWebAppData");
  if(q)return q;
  return new URLSearchParams(location.hash.replace(/^#/,"")).get("tgWebAppData")||"";
}
function hdrs(x){
  var h={"Content-Type":"application/json"};
  var t=tgInit();if(t)h["x-tg-initdata"]=t;
  return h;
}
function dsnap(c,id){var v=(D[c]||{})[id];return {id:id,exists:v!==undefined,data:function(){return v===undefined?undefined:JSON.parse(JSON.stringify(v))},ref:dref(c,id)}}
function csnap(c){var docs=Object.keys(D[c]||{}).map(function(id){return dsnap(c,id)});return {docs:docs,size:docs.length,empty:!docs.length,forEach:function(f){docs.forEach(f)},metadata:{fromCache:false}}}
function onS(mk){return function(cb,err){var s={mk:mk,cb:cb,err:err};subs.push(s);setTimeout(function(){fire(s)},0);return function(){var i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}}
function fire(s){try{s.cb(s.mk())}catch(e){ping("snapshot cb: "+String(e&&e.message||e).slice(0,150));if(s.err)s.err(e)}}
function banner(msg){var b=document.getElementById("banner")||document.querySelector(".banner");
  if(b){b.textContent=msg;b.hidden=!msg}else if(msg){var s=document.createElement("div");
  s.style.cssText="position:sticky;top:0;z-index:9999;background:#fbefe2;padding:8px 16px;font:13px system-ui";
  s.textContent=msg;document.body.insertBefore(s,document.body.firstChild)}}
function refresh(){if(cur)return cur;
  cur=fetch(API,{method:"POST",cache:"no-store",headers:hdrs(),body:JSON.stringify({op:"read"})}).then(function(r){return r.json()})
    .then(function(j){if(!j||!j.ok)throw new Error((j&&j.error)||"bad payload");
      var sig=JSON.stringify(j.data);var changed=sig!==lastSig;lastSig=sig;D=j.data||{};
      if(changed){subs.forEach(fire)}})
    .catch(function(e){ping(e&&e.message||e);if(!started)banner("Нет связи: открой страницу из Telegram.")})
    .then(function(){started=true;cur=null});
  return cur}
function post(req){return fetch(API,{method:"POST",headers:hdrs(),body:JSON.stringify(req)})
  .then(function(r){return r.json().catch(function(){return {ok:false}})})
  .then(function(j){if(!j||!j.ok)ping("post "+(req&&req.op||"")+" → "+((j&&j.error)||"нет ответа"));if(!j||!j.ok)throw {code:"server",message:(j&&j.error)||"сервер отклонил операцию"};return refresh()})
  .catch(function(e){if(!e||e.code!=="server")ping("post "+(req&&req.op||"")+" → сеть: "+String(e&&e.message||e).slice(0,120));throw e})}
function dref(c,id){return {id:id,path:c+"/"+id,
  onSnapshot:onS(function(){return dsnap(c,id)}),
  get:function(){return refresh().then(function(){return dsnap(c,id)})},
  set:function(v){return post({op:"set",coll:c,id:id,patch:v||{}})},
  update:function(patch){return post({op:"set",coll:c,id:id,patch:patch||{}})},
  delete:function(){return post({op:"del",coll:c,id:id})}}}
function cref(c){return {id:c,
  onSnapshot:onS(function(){return csnap(c)}),
  get:function(){return refresh().then(function(){return csnap(c)})},
  doc:function(id){return dref(c,id)},
  add:function(doc){return post({op:"add",coll:c,doc:doc||{}})},
  where:function(){return cref(c)},orderBy:function(){return cref(c)},limit:function(){return cref(c)}}}
window.claude={use:function(n){
  if(n==="db")return Promise.resolve({collection:function(c){return cref(c)},doc:function(p){var i=p.indexOf("/");return dref(p.slice(0,i),p.slice(i+1))}});
  if(n==="user")return Promise.resolve({can:function(){return Promise.resolve(true)}});
  return Promise.reject({code:"no_impl"})}};

document.body.appendChild(lock);
function unlock(){if(lock.parentNode)lock.parentNode.removeChild(lock)}
function isAuthed(){try{if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData)return true}catch(e){}return !!tgInit()}
var tg=document.createElement("script");tg.src="https://telegram.org/js/telegram-web-app.js";
tg.onload=function(){try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}catch(e){}}
document.head.appendChild(tg);
ping("start");

whenSdk();
try{window.addEventListener("focus",function(){if(isAuthed())refresh()})}catch(e){}
})();

function sleepNights(n,end){end=end||TODAY;const out=[];for(let i=0;i<n;i++){const d=addDays(end,-i);if(M().start&&d<M().start)break;const D=getD(d);

function typ(h,b){
  if(b==null)return 'пока нет данных';
  if(h.per==='week')return b<0.15?'почти не бывает':'около '+num(r1(b))+' в неделю';
  if(b<0.12)return 'почти не бывает';
  if(b<1&&h.unit!=='ч'){const n=Math.round(1/b);return 'примерно раз в '+n+' '+plural(n,'день','дня','дней')}
  return 'около '+num(r1(b))+' '+h.unit+' в день';
}
function habRow(h,d){
  const t=targetAt(h,d),c=cnt(d,h.id),o=over(h,d),b=baseline(h);
  let sub;
  if(t==null){const fs=firstStageOf(h.id);sub=(fs>=0?`лимит с этапа ${fs+1}`:'без лимита по программе')+(b!=null?` · обычно: ${typ(h,b)}`:'')}
  else if(h.id==='weed'){const cl=cleanStreak('weed');sub=`цель 0${cl!=null?` · ${cl} дн. без`:''}`}
  else if(h.per==='week')sub=`лимит: ${num(t)} в неделю · сейчас за неделю: ${num(weekSum(h,d))}${b!=null?` · раньше: ${typ(h,b)}`:''}`;
  else sub=`лимит: ${num(t)} ${h.unit} в день${b!=null?` · раньше: ${typ(h,b)}`:''}`;
  const pill=o===true?'<span class="pill over">сверх</span>':o===false&&isClosed(d)?'<span class="pill ok">в лимите</span>':'';
  const ctrl=h.parts?`<output class="tot" aria-label="${h.name}: всего">${num(c)}</output>`:`<div class="cnt"><button data-a="dec" data-v="${h.id}" aria-label="${h.name}: меньше">−</button><output>${num(c)}</output><button data-a="inc" data-v="${h.id}" aria-label="${h.name}: больше">+</button></div>`;
  const parts=h.parts?`<details class="fold" data-k="parts_${h.id}" ${opn('parts_'+h.id,false)} style="padding:0 0 6px"><summary class="tiny">по видам${c>0?': '+h.parts.filter(p=>rawCnt(d,h.id+'.'+p.id)).map(p=>p.name.split(/[:,(]/)[0]+' '+num(rawCnt(d,h.id+'.'+p.id))).join(', '):''} ▾</summary><div class="parts">${h.parts.map(p=>{const k=h.id+'.'+p.id,v=rawCnt(d,k);return `<div class="part ${v?'on':''}"><span class="small">${p.name}</span><div class="cnt sm"><button data-a="dec" data-v="${k}" aria-label="${p.name}: меньше">−</button><output>${num(v)}</output><button data-a="inc" data-v="${k}" aria-label="${p.name}: больше">+</button></div></div>`}).join('')}</div></details>`:'';
  const zb=ZEROS.some(z=>z.id===h.id)&&c===0?`<div style="padding:0 12px 10px"><button class="chip ${zeroOk(d,h.id)?'on':''}" data-a="zero" data-v="${h.id}" aria-pressed="${zeroOk(d,h.id)}">${zeroOk(d,h.id)?'✓ ':''}${d===TODAY?'Сегодня не было':'Не было'}</button></div>`:'';
  return `<div class="hab-wrap"><div class="hab ${o?'over':''}"><div class="n"><b>${h.name}${pill}</b><span class="mute tiny">${sub}${h.parts?' · сумма по видам ниже':''}</span></div>${ctrl}</div>${parts}${zb}</div>`;
}

function stageBody(i){
  const st=STAGES[i],isPast=i<=curStage();
  const tg=Object.keys(st.targets).map(id=>{const h=hab(id),v=st.targets[id];
    const txt=typeof v==='function'?(id==='snus'?'неделя −50% от базы, неделя −75%, затем 0':id==='dofa'?'−50% от базы, через 2 недели не больше 1 в день, через 4 недели 0':'−50% от базы'):(v===0?'0':'не больше '+num(v)+' '+(h.per==='week'?'в неделю':h.unit));
    const now=isPast&&typeof v==='function'?targetAt(h,TODAY):null;
    return `<li><b>${h.name}</b>: ${txt}${now!=null?` (сейчас ${num(now)})`:''}</li>`}).join('');
  return `<p style="margin:0">${st.why}</p>
  ${tg?`<div class="sub">Лимиты</div><ul class="plain">${tg}</ul>`:''}
  ${st.do.length?`<div class="sub">Каждый день</div><ul class="plain">${st.do.map(x=>`<li>${itShort(x)}${qdots(x.q)}</li>`).join('')}</ul>`:''}
  ${(st.weekly||[]).length?`<div class="sub">Раз в неделю</div><ul class="plain">${st.weekly.map(x=>`<li>${x.name}${qdots(x.q)}</li>`).join('')}</ul>`:''}
  ${(st.once||[]).length?`<p class="mute tiny" style="margin:0">Разовые дела этапа — во вкладке «Здоровье» → «Дела».</p>`:''}
  ${st.swaps.length?`<div class="sub">Замены</div><ul class="sw">${st.swaps.map(([a,b])=>`<li><s>${a}</s> → <b>${b}</b></li>`).join('')}</ul>`:''}
  <div class="sub">План «если → то»</div>${st.ifthen.map(x=>`<div class="it">${x}</div>`).join('')}
  ${i<LAST?`<div class="it small"><b>Что такое хороший день.</b> Это закрытый день, в котором ты сделал не меньше двух третей ежедневных действий этапа (сейчас нужно ${Math.ceil(st.do.length*.66)} из ${st.do.length}) и не превысил ни один лимит этапа. <b>Когда переходить дальше:</b> когда за последние 7 дней набралось хотя бы 4 хороших дня. Тяжёлые дни (отмечены «Сегодня тяжёлый день») пропускаются и не портят счёт. Сколько осталось до хорошего дня сегодня, видно на экране «Сегодня».</div>`:''}`;
}

const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1))};
function mv(d,k){
  const D=S.days[d];if(!D)return null;
  if(k==='sleep')return sleepOf(D);
  if(k==='pulse'){const l=bpList(d).map(r=>r.pulse).filter(Boolean);return l.length?mean(l):null}
  const v=D[k];return v==null||v===''?null:+v;
}
function wellbeing(d){
  const D=S.days[d];if(!D)return null;const p=[];
  if(D.mood)p.push((D.mood-1)/4);
  if(D.energy)p.push((D.energy-1)/4);
  if(D.anx)p.push(1-(D.anx-1)/4);
  const s=sleepOf(D);if(s)p.push(Math.max(0,Math.min(1,(s-4)/4)));
  return p.length>=2?mean(p)*100:null;
}

function linkRows(){

 {l:'кофе, чашек',g:d=>isClosed(d)?cnt(d,'coffee'):null},
 {l:'никотин, раз в день',g:d=>known(d,'snus')},
 {l:'тревога (1–5)',g:d=>mv(d,'anx')},
 {l:'шаги, тыс.',g:d=>D_(d).steps?D_(d).steps/1000:null},
 {l:'верхнее давление',r:0,g:d=>mv(d,'sys')}
];
function bodyLinks(){
  const days=Object.keys(S.days).filter(d=>d>=M().start&&d<=TODAY),out=[];
  [...FEELS.body,...FEELS.bodyGood].forEach(b=>{
    const has=days.filter(d=>(D_(d).feel||[]).includes(b)),no=days.filter(d=>isClosed(d)&&!(D_(d).feel||[]).includes(b));
    if(has.length<3||no.length<3)return;
    let best=null;
    BODYF.forEach(x=>{
      const a=has.map(d=>x.g(d)).filter(v=>v!=null&&!Number.isNaN(v)),c=no.map(d=>x.g(d)).filter(v=>v!=null&&!Number.isNaN(v));
      if(a.length<3||c.length<3)return;
      const s=sd([...a,...c]);if(!s)return;
      const z=(mean(a)-mean(c))/s;
      if(Math.abs(z)>=.5&&(!best||Math.abs(z)>Math.abs(best.z)))best={x,z,a:mean(a),c:mean(c)};
    });
    if(best)out.push({b,...best,n:has.length});
  });
  return out.sort((p,q)=>Math.abs(q.z)-Math.abs(p.z)).slice(0,5);
}
const pv=(d,k,t)=>{const v=mv(addDays(d,-1),k);return v==null?null:t(v)};
const PRECUR=[
 {l:'Короткий сон прошлой ночью (меньше 7 ч)',f:d=>{const s=mv(d,'sleep');return s==null?null:s<7}},
 {l:'Подъём позже якоря',f:d=>D_(d).wake?!doDone({auto:'wake'},d):null},
 {l:'Накануне высокая тревога (4–5)',f:d=>pv(d,'anx',v=>v>=4)},

 {l:'Накануне не выходил на улицу',f:d=>{const p=addDays(d,-1);return isClosed(p)?!(D_(p).do||{}).out:null}},
 {l:'Накануне был тяжёлый день',f:d=>{const p=D_(addDays(d,-1));return p.closed?!!p.hard:null}},
 {l:'Накануне не было ЛФК',f:d=>{const p=D_(addDays(d,-1));return p.closed?!(p.do&&p.do.lfk):null}},

function isEvent(d){
  const D=S.days[d];if(!D)return null;
  if(!D.closed&&D.craveWeed==null&&D.crave==null)return null;
  return (D.craveWeed>=2)||cnt(d,'weed')>0||D.crave===3||HABITS.filter(h=>over(h,d)===true).length>=2;
}
const isDofa=d=>{const D=S.days[d];if(!D||!D.closed||!dofaOn(d))return null;return cnt(d,'dofa')>0};
function precursors(evFn=isEvent){
  const days=Object.keys(S.days).filter(d=>d>=M().start&&d<=TODAY).sort();
  const ev=days.filter(d=>evFn(d)===true),no=days.filter(d=>evFn(d)===false);
  if(ev.length<3||no.length<3)return[];
  const out=[];
  PRECUR.forEach(p=>{
    const a=ev.map(d=>p.f(d)).filter(v=>v!=null),b=no.map(d=>p.f(d)).filter(v=>v!=null);
    if(a.length<3||b.length<3)return;
    const na=a.filter(Boolean).length,pa=na/a.length,pb=b.filter(Boolean).length/b.length;
    if(pa-pb>=.25&&na>=2)out.push({l:p.l,f:p.f,pa,pb,n:a.length});
  });
  return out.sort((x,y)=>(y.pa-y.pb)-(x.pa-x.pb)).slice(0,3);
}

function weightPts(){const p=[];if(M().startWeight)p.push([0,+M().startWeight]);Object.keys(S.weeks).forEach(k=>{const x=S.weeks[k];if(x&&x.weight)p.push([+k.slice(1)+1,+x.weight])});return p.sort((a,b)=>a[0]-b[0])}
function weightAt(w){let best=null;weightPts().forEach(([t,v])=>{if(t<=w+1&&(!best||t>best[0]))best=[t,v]});return best?best[1]:null}
function weightPace(){const p=weightPts().slice(-5);if(p.length<2)return null;const dt=p[p.length-1][0]-p[0][0];return dt>0?(p[0][1]-p[p.length-1][1])/dt:null}

  const ds=Object.keys(S.days).filter(d=>d>=(from||M().start)&&d<=TODAY&&isClosed(d)).sort();
  if(!ds.length)return null;let last=null;ds.forEach(d=>{if(cnt(d,id)>0)last=d});

function pillars(){

  if(!days.length)return null;

  return{n:days.length,
    sleep:p(days.filter(d=>regime(d).items[0].ok).length/days.length),
    food:p(mean(days.map(d=>regime(d).meals/3))),
    move:p(days.filter(d=>{const r=regime(d);return r.items[5].ok||r.walk}).length/days.length)};
}
function winStats(d0,d1){
  const days=[];for(let d=d0;d<=d1&&d<=TODAY;d=addDays(d,1))if(d>=M().start&&isClosed(d))days.push(d);
  const av=k=>{const v=days.map(d=>mv(d,k)).filter(x=>x!=null);return v.length?mean(v):null};
  const rd=days.filter(regOn),dd=days.filter(dofaOn),vs=M().values&&M().values.since,vd=vs?days.filter(d=>d>=vs):[];
  return{n:days.length,sys:av('sys'),dia:av('dia'),sleep:av('sleep'),mood:av('mood'),energy:av('energy'),anx:av('anx'),steps:av('steps'),
    reg:rd.length?mean(rd.map(d=>{const r=regime(d);return r.done/r.total})):null,
    dofaN:dd.length,dofa:dd.reduce((t,d)=>t+cnt(d,'dofa'),0),
    weed:days.filter(d=>cnt(d,'weed')>0).length,snus:(()=>{const v=days.map(d=>known(d,'snus')).filter(x=>x!=null);return v.length?mean(v):null})(),
    vN:vd.length,vD:vd.filter(d=>(S.days[d].val||[]).length).length};
}

/* ---------- Тяга: причины, время, скука ---------- */
const WHYS=[{id:'bored',n:'Скука, нечем заняться'},{id:'tired',n:'Усталость'},{id:'tense',n:'Напряжение, тревога'},{id:'home',n:'Ссора или холод дома'},{id:'alone',n:'Один, пусто'},{id:'late',n:'Поздно вечером'},{id:'habit',n:'Просто привычка, само'}];
const BORED_DEF='Выйти на улицу на 20 минут\nЛФК или 20 приседаний\nПозвонить или написать живому человеку\nХолодный душ\nПриготовить еду\nОдно маленькое дело из списка «давно хотел»';
const boredList=()=>String(M().boredText==null?BORED_DEF:M().boredText).split('\n').map(x=>x.trim()).filter(Boolean);

const pullBucket=t=>{const h=+String(t).slice(0,2);return h>=6&&h<12?'утром':h>=12&&h<17?'днём':h>=17&&h<22?'вечером':'ночью'};
function pullsBlock(){
  const all=[];Object.keys(S.days).sort().forEach(d=>(S.days[d].pulls||[]).forEach(p=>all.push(Object.assign({d},p))));
  if(all.length<3)return `<h2>Тяга: когда и почему</h2><section class="card"><p class="empty">Появится после трёх записей в окне «Тянет»: отметь причину и нажми «Прошло» или «Не удержался». Сейчас записано: ${all.length}.</p></section>`;
  const byW={};all.forEach(p=>{if(p.w)byW[p.w]=(byW[p.w]||0)+1});

  const bl=Object.entries(bk).sort((a,b)=>b[1]-a[1]);
  const wd=['в воскресенье','в понедельник','во вторник','в среду','в четверг','в пятницу','в субботу'],dd={};

    ${withW>=3?`<div class="ins">Скука — <b>${Math.round(bored/withW*100)}%</b> тяг с причиной${bored/withW>=.4?'. Это главный триггер: держи под рукой готовый список занятий.':'.'}</div>`:''}
    ${wl.map(([id,n])=>{const p=Math.round(n/withW*100);return `<div class="cmp"><div class="row small"><span>${esc((WHYS.find(x=>x.id===id)||{n:id}).n)}</span><b>${n}</b></div><div class="c ${id==='bored'?'':'acc'}" style="width:${p}%"></div></div>`}).join('')}
    <div class="ins">Чаще всего тянет <b>${bl[0][0]}</b> (${bl[0][1]} из ${all.length})${dl[0][1]>=2?`, и чаще <b>${dl[0][0]}</b>`:''}</div>
    <p class="mute tiny" style="margin:0">Это закономерности, а не оценка. Чем точнее отмечаешь причину, тем точнее подсказки.</p></section>`;

/* ---------- Сон и улица: что они дают ---------- */
const outdoorsDay=d=>{const D=S.days[d]||{};return !!((D.do&&D.do.out)||(D.walkMin||0)>=30||(D.steps||0)>=stepGoal(d))};
function sleepOutBlock(){
  const days=Object.keys(S.days).filter(d=>d>=M().start&&d<=TODAY&&isClosed(d)).sort().slice(-60);
  const MET=[
    {l:'Настроение (1–5)',g:d=>mv(d,'mood'),hi:1},
    {l:'Энергия (1–5)',g:d=>mv(d,'energy'),hi:1},
    {l:'Тревога (1–5)',g:d=>mv(d,'anx'),hi:0},
    {l:'Дофа, раз в день',g:d=>cnt(d,'dofa'),hi:0},
    {l:'Дней с тягой, %',g:d=>D_(d).dofaPull==null&&!(D_(d).urges)?null:((D_(d).dofaPull===true||D_(d).urges>0)?100:0),hi:0,pct:1}
  ];
  const part=(title,fa,fb,la,lb,extra)=>{
    const A=days.filter(d=>fa(d)===true),B=days.filter(d=>fa(d)===false);
    if(A.length<4||B.length<4)return `<div class="ins"><b>${title}</b>: пока мало данных (${la}: ${A.length}, ${lb}: ${B.length}). Нужно минимум по 4 дня.</div>`;
    const M2=MET.concat(extra||[]);
    const rows=M2.map(m=>{
      const a=A.map(m.g).filter(x=>x!=null),b=B.map(m.g).filter(x=>x!=null);
      if(a.length<3||b.length<3)return '';
      const ma=mean(a),mb=mean(b),sd=Math.max(.0001,(Math.max(...a.concat(b))-Math.min(...a.concat(b)))/4);
      const better=m.hi?ma>mb:ma<mb,diff=Math.abs(ma-mb)/sd>=.35;
      const f=m.pct?Math.round:v=>num(r1(v));
      return `<div class="row small"><span>${m.l}</span><span><b style="color:${diff?(better?'var(--ok)':'var(--warn)'):'inherit'}">${f(ma)}</b> <span class="mute">а в другие дни</span> <b>${f(mb)}</b></span></div>`}).join('');
    return `<div class="ins"><b>${title}</b></div><div class="mute tiny" style="margin:-4px 0 4px">Слева: ${la} (${A.length} дн.), справа: ${lb} (${B.length} дн.)</div>${rows}`;
  };
  const sleepOk=d=>{const s=mv(d,'sleep');return s==null?null:(s>=7&&s<=9.5)};
  const nextSleep={l:'Сон следующей ночью, ч',g:d=>{const x=mv(addDays(d,1),'sleep');return x},hi:1};
  return `<h2>Сон и улица</h2><section class="card" style="gap:6px">
    ${part('Ночь 7–9,5 часов и день после неё',sleepOk,null,'сон в норме','сон не в норме')}
    <hr style="border:0;border-top:1px solid var(--line,#ddd);width:100%;margin:6px 0">
    ${part('Был на улице (прогулка 30+ минут, шаги или дневной свет) и тот же день',outdoorsDay,null,'была улица','не было улицы',[nextSleep])}
    <p class="mute tiny" style="margin:0">Зелёный — заметно лучше, оранжевый — заметно хуже. Это связь, а не доказательство причины, но по ней видно, куда вкладывать силы.</p></section>`;
}
/* ---------- Опыты на 14 дней ---------- */
const bedOkD=d=>{const b=(S.days[d]||{}).bed;if(!b)return null;const m=tmin(b);return m>=19*60&&m<=23*60+30};
const EXPS=[
 {id:'out',n:'Улица каждый день',h:'30 минут пешком или шаги до цели',f:d=>outdoorsDay(d)},
 {id:'bed',n:'Лечь до 23:30',h:'считается по времени «лёг» в «Утро»',f:d=>bedOkD(d)},
 {id:'lfk',n:'ЛФК каждый день',h:'отметка в режиме',f:d=>!!(D_(d).do&&D_(d).do.lfk)},
 {id:'water',n:'Вода: 6 стаканов и больше',h:'считается по счётчику воды',f:d=>(D_(d).water||0)>=6},
 {id:'dinner',n:'Ужин в окне 19:00–20:00',h:'отметка в режиме',f:d=>!!D_(d).mealD}
];
const expDef=id=>EXPS.find(x=>x.id===id);
const EXPLEN=14;
function expInfo(){
  const E=M().exp;if(!E)return null;const def=expDef(E.id);if(!def)return null;
  const end=addDays(E.start,EXPLEN-1);
  const dl=Array.from({length:EXPLEN},(_,i)=>addDays(E.start,i));
  const st=dl.map(d=>d>TODAY?'future':(d===TODAY&&!isClosed(d))?'today':!isClosed(d)?'skip':(def.f(d)?'yes':'no'));
  const n=Math.min(EXPLEN,Math.max(1,diffDays(TODAY,E.start)+1));
  return{E,def,end,dl,st,n,done:TODAY>end,kept:st.filter(x=>x==='yes').length,closedKept:st.filter(x=>x==='yes'||x==='no').length};
}
function expResults(I){
  const win=I.dl.filter(d=>d<=TODAY&&isClosed(d)),base=Array.from({length:EXPLEN},(_,i)=>addDays(I.E.start,-1-i)).filter(d=>d>=M().start&&isClosed(d));
  if(win.length<5||base.length<5)return null;
  const MT=[{l:'Настроение (1–5)',g:d=>mv(d,'mood'),hi:1},{l:'Энергия (1–5)',g:d=>mv(d,'energy'),hi:1},{l:'Тревога (1–5)',g:d=>mv(d,'anx'),hi:0},{l:'Дофа, раз в день',g:d=>cnt(d,'dofa'),hi:0},{l:'Сон, часов',g:d=>mv(d,'sleep'),hi:1}];
  const rows=MT.map(m=>{const a=base.map(m.g).filter(x=>x!=null),b=win.map(m.g).filter(x=>x!=null);if(a.length<3||b.length<3)return '';
    const ma=mean(a),mb=mean(b),all=a.concat(b),sd=Math.max(.0001,(Math.max(...all)-Math.min(...all))/4),d=(mb-ma)/sd;
    const up=Math.abs(d)>=.35,good=m.hi?mb>ma:mb<ma;
    return `<div class="row small"><span>${m.l}</span><span>${num(r1(ma))} → <b style="color:${up?(good?'var(--ok)':'var(--warn)'):'inherit'}">${num(r1(mb))}</b></span></div>`}).join('');
  return{rows,win:win.length,base:base.length};
}

function closedSeries(){
  const st=M().start;if(!st)return{cur:0,best:0};
  let best=0,run=0;for(let d=st;d<=TODAY;d=addDays(d,1)){if(isClosed(d)){run++;if(run>best)best=run}else if(d!==TODAY)run=0}
  let cur=0,d=isClosed(TODAY)?TODAY:addDays(TODAY,-1);while(d>=st&&isClosed(d)){cur++;d=addDays(d,-1)}
  return{cur,best:Math.max(best,cur)};
}

function winSuggest(d){
  const D=S.days[d]||{},out=[];
  dailyAt(stageAt(d)).forEach(it=>{if(doDone(it,d))out.push(itShort(it))});
  weeklyAt(stageAt(d)).forEach(it=>{if(D.do&&D.do[it.id])out.push(it.name)});
  if(D.urges)out.push('Пережил тягу'+(D.urges>1?` ${D.urges} раза`:''));
  ZEROS.forEach(z=>{if(cnt(d,z.id)===0&&zeroOk(d,z.id))out.push('Без: '+z.n.toLowerCase())});
  HABITS.forEach(h=>{if(over(h,d)===false&&cnt(d,h.id)>0)out.push(h.name+': в лимите')});
  const sl=sleepOf(D);if(sl!=null&&sl>=7&&sl<=9.5)out.push('Выспался');
  if(D.commit===true)out.push('Держал обязательство недели');
  if(D.med)out.push('Режим с лекарством');
  out.push('Честно отметил день');
  return [...new Set(out)].slice(0,14);
}

    shade('<h3>Записал</h3><p>Без самобичевания: это было, и следующий выбор снова твой. Отметь в привычках, сколько было, и возвращайся к обычному плану. Запись поможет найти, где и когда тяга сильнее.</p><button class="pri" data-a="close">Ок</button>');render();return}
  if(a==='urgeok'){const D=mutD(TODAY);D.urges=(D.urges||0)+1;{const n=new Date();D.pulls=D.pulls||[];D.pulls.push({t:pad(n.getHours())+':'+pad(n.getMinutes()),w:urgeWhy||null,h:urgeHab||null})}touchD(TODAY);clearInterval(timer);
    shade('<h3>Это победа · Спокойствие +2</h3><p>Тяга прошла, и ты не сорвался. Каждая пережитая волна ослабляет связку «триггер → действие».</p><button class="pri" data-a="close">Ок</button>');render();return}
  if(a==='next'){const s=curStage();if(s>=LAST)return;const R=readiness();
    const go=()=>{M().stageStarts.push(TODAY);touch('meta/state');render();window.scrollTo(0,0);toast('Новый этап: '+STAGES[s+1].title)};
    if(R.ok&&R.days>=14)go();else ask('Перейти раньше?','Этап ещё не закрепился. Можно идти дальше, но устойчивее — ещё неделю на этом. Лимиты и действия текущего этапа в любом случае останутся.','Всё равно перейти',go);return}
  if(a==='riskadd'){M().risks=[...(M().risks||[]),{s:'',r:''}];touch('meta/state');render();return}
  if(a==='riskdel'){M().risks=(M().risks||[]).filter((_,i)=>i!==+v);touch('meta/state');render();return}
  if(a==='riskex'){M().risks=[{s:'вечер, один дома, скучно',r:'выйти на 15 минут на улицу или к жене, чай'},{s:'встреча с теми, с кем курил',r:'заранее фраза «я в завязке», уйти через час'},{s:'не спится',r:'правило 20 минут: встать, книга, никаких «чтобы уснуть»'},{s:'стресс, ссора, плохие новости',r:'6 выдохов, выйти из дома, написать одному человеку'},{s:'вижу приложение или человека, у которого брал',r:'удалить контакт или замьютить, не заходить'}];touch('meta/state');render();return}
  if(a==='seg'){const[t,id]=v.split('|');SEG[t]=id;render();const b=document.querySelector('.seg');if(b)window.scrollTo(0,Math.max(0,b.getBoundingClientRect().top+window.scrollY-6));return}
  if(a==='goplan'){SEG.plan='stage';setTab('plan');return}
  if(a==='goai'){closeModal();SEG.stats='ai';setTab('stats');return}
  if(a==='settime'){const[k,t]=v.split('|');setTimeField(k,t);return}
  if(a==='wakenow'){const n=new Date();setTimeField('wake',pad(n.getHours())+':'+pad(n.getMinutes()));return}
  if(a==='guideoff'){M().guideOff=true;touch('meta/state');render();return}
  if(a==='ai'){aiAsk(v);return}
  if(a==='aiq'){const i=$('#ai_q'),t=(i&&i.value||'').trim();if(!t){if(i)i.focus();return}aiAsk(null,t);return}
  if(a==='aistop'){if(aiCtl)aiCtl.abort();return}
  if(a==='ainew'){aiTurns=[];aiText='';aiErr='';render();return}
  if(a==='bp'){bpSheet();return}
  if(a==='bpsave'){const sy=+$('#bp_s').value,di=+$('#bp_d').value,pu=+$('#bp_p').value||null,tt=$('#bp_t').value||'';
    if(!(sy>50&&sy<260&&di>30&&di<180)){toast('Проверь цифры: верхнее и нижнее');return}
    const D=mutD(cur);if(!D.bp&&D.sys)D.bp=[{t:'',sys:D.sys,dia:D.dia}];D.bp=[...(D.bp||[]),{t:tt,sys:sy,dia:di,pulse:pu}].sort((x,y)=>(x.t||'').localeCompare(y.t||''));bpRecalc(D);touchD(cur);closeModal();render();
    if(sy>=180||di>=110)shade('<h3>Высокое давление</h3><div class="alert"><b>'+sy+'/'+di+' — свяжись с врачом сегодня.</b> Если есть сильная головная боль, боль в груди, слабость, нарушение зрения или речи — вызывай скорую (103 или 112).</div><button class="pri" data-a="close">Понял</button>');
    else toast('Замер сохранён: '+sy+'/'+di);return}
  if(a==='bpdel'){const D=mutD(cur);if(!D.bp&&D.sys)D.bp=[{t:'',sys:D.sys,dia:D.dia}];D.bp=(D.bp||[]).filter((_,i)=>i!==+v);bpRecalc(D);touchD(cur);render();return}
  if(a==='hideonce'){M().hideOnce=M().hideOnce||{};M().hideOnce[v]=true;touch('meta/state');render();return}
  if(a==='unhide'){M().hideOnce={};touch('meta/state');render();return}
  if(a==='addstep'){const i=$('#new_step'),n=(i&&i.value||'').trim();if(!n)return;M().myOnce=[...(M().myOnce||[]),{id:'m'+Date.now().toString(36),name:n,done:false}];touch('meta/state');render();return}
  if(a==='mine'){const x=(M().myOnce||[]).find(o=>o.id===v);if(x){x.done=!x.done;touch('meta/state');render()}return}
  if(a==='minedel'){M().myOnce=(M().myOnce||[]).filter(o=>o.id!==v);touch('meta/state');render();return}
  if(a==='labdel'){const l=LABS.find(x=>x.id===v);if(!l)return;ask('Удалить файл?','«'+esc(l.name)+'» удалится навсегда.','Удалить',async()=>{try{await assets.delete(l.asset);await db.collection('labs').doc(l.id).delete();toast('Удалено')}catch(e){toast('Не удалось удалить')}});return}
  if(a==='review'){reviewSheet(+v);return}
  if(a==='auto'){const[id,n]=v.split('|');const R=rv();R.auto=R.auto||{};R.auto[id]=+n;touch('weeks/'+wkey(revW));
    t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));return}
  if(a==='shift'){M().anchor=mtime(tmin(M().anchor)-15);touch('meta/state');reviewSheet(revW);return}
  if(a==='revsave'){rv();touch('weeks/'+wkey(revW));closeModal();render();toast('Обзор сохранён');return}
  if(a==='reset'){ask('Сбросить всё?','Удалятся все дни, обзоры и настройки на всех устройствах. Отменить это нельзя.','Удалить всё',()=>{
    const paths=[...Object.keys(S.days).map(d=>'days/'+d),...Object.keys(S.weeks).map(w=>'weeks/'+w)];
    S={meta:defMeta(),days:{},weeks:{}};paths.forEach(p=>dirty.add(p));touch('meta/state');tab='today';render()});return}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act(t,e)});
/* выбор годовой цели не закрывает клавиатуру и не сдвигает экран */
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-a=wgtag],[data-a=g2tag]'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.gin){e.preventDefault();const[ga,gk]=e.target.dataset.gin.split('|');(ga.startsWith('wg')?wgAct:ga.startsWith('g3')?g3Act:g2Act)(ga,gk);return}if(e.key==='Enter'&&e.target.id==='g2_new'){e.preventDefault();g2Act('g2add');return}if(e.key==='Enter'&&e.target.id==='yp_new'){e.preventDefault();act($('[data-a=ypadd]'),e);return}if(e.key==='Enter'&&/^bp_/.test(e.target.id||'')){e.preventDefault();act($('[data-a=bpsave]'),e);return}if(e.key==='Enter'&&e.target.id==='new_step'){e.preventDefault();act($('[data-a=addstep]'),e);return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=checkbox][data-a]')){e.preventDefault();act(e.target,e)}});
function setTimeField(k,v){
  const D=mutD(cur);D[k]=v||null;if(k==='wake')D.anchor=D.anchor||M().anchor;
  const c=sleepCalc(D.wake,D.bed);if(c!=null)D.sleep=c;
  touchD(cur);softRender();
}
function onField(e){
  const t=e.target,inp=t.dataset.in;
  if(t.dataset.yp||t.dataset.ypr){ypField(t);return}
  if(t.dataset.g2inc){G2().income[t.dataset.g2inc]=t.value===''?null:Math.max(0,+t.value);touch('meta/state');softRender();return}
  if(t.id==='lab_file'){const fs=[...t.files];t.value='';if(fs.length)uploadLabs(fs);return}
  if(t.dataset.lab){const[id,f]=t.dataset.lab.split('|');if(db)db.collection('labs').doc(id).update({[f]:t.value}).catch(()=>toast('Не сохранилось'));return}
  if(t.dataset.rd){RD[t.dataset.rd]=t.value;return}
  if(t.dataset.val){const[k,id]=t.dataset.val.split('|'),V0=V();
    if(k==='s'){V0.spheres=V0.spheres||{};V0.spheres[id]=t.value}
    else if(k==='b'){V0.broke=t.value}
    else if(k==='bor'){M().boredText=t.value}
    else if(k==='t'){const c=V0.chosen.find(x=>x.id===id);if(c)c.text=t.value}
    touch('meta/state');return}
  if(t.dataset.cp){const[k,f]=t.dataset.cp.split('|');M().cp=M().cp||{};(M().cp[k]=M().cp[k]||{})[f]=t.value;touch('meta/state');return}
  const numOrNull=x=>x===''?null:+x;
  if(inp==='bed'||inp==='wake'){setTimeField(inp,t.value)}
  else if(inp==='stepsY'||inp==='walkMinY'){const y=addDays(cur,-1),D=mutD(y);D[inp.slice(0,-1)]=numOrNull(t.value);touchD(y);softRender()}
  else if(inp==='steps'||inp==='walkMin'||inp==='hrv'||inp==='nhr'||inp==='sys'||inp==='dia'){const D=mutD(cur);D[inp]=numOrNull(t.value);touchD(cur);softRender()}
  else if(inp==='note'){const D=mutD(cur);D.note=t.value;touchD(cur)}
  else if(inp==='tomorrow'){const n=addDays(cur,1),D=mutD(n);D.task=t.value;touchD(n)}
  else if(inp==='anchor'||inp==='anchorGoal'){if(t.value){M()[inp]=t.value;touch('meta/state')}}
  else if(inp==='reasons'){M().reasons=t.value;touch('meta/state')}
  else if(t.dataset.risk){const[i,f]=t.dataset.risk.split('|');const r=(M().risks||[])[+i];if(r){r[f]=t.value;touch('meta/state')}}
  else if(inp==='weedLast'){M().weedLast=t.value||null;touch('meta/state');softRender()}
  else if(inp==='goalWeight'){M().goals=M().goals||{};M().goals.weight=numOrNull(t.value);touch('meta/state');softRender()}
  else if(inp==='stepsBase'){M().stepsBase=numOrNull(t.value);touch('meta/state');softRender()}
  else if(t.dataset.over){M().over[t.dataset.over]=t.value===''?null:Math.max(0,+t.value);touch('meta/state');softRender()}
  else if(t.dataset.rv==='weight'){rv().weight=numOrNull(t.value);touch('weeks/'+wkey(revW))}
  else if(t.dataset.rv==='waist'){rv().waist=numOrNull(t.value);touch('weeks/'+wkey(revW))}
  else if(t.dataset.rv==='note'){rv().note=t.value;touch('weeks/'+wkey(revW))}
  else if(['learn','proud','change'].includes(t.dataset.rv)){rv()[t.dataset.rv]=t.value;touch('weeks/'+wkey(revW))}
}
let inT=null,pendingField=null;
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.price){M().prices=M().prices||{};M().prices[e.target.dataset.price]=e.target.value===''?null:+e.target.value;touch('meta/state');render();return}if(e.target.dataset&&e.target.dataset.ap){AP[e.target.dataset.ap]=e.target.value||null;AP.p='custom';saveAP();render();return}if(pendingField&&pendingField.target===e.target){clearTimeout(inT);pendingField=null}onField(e)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='cm_in'){CMD=t.value;return}if(t.id==='op_in'){OPD=t.value;return}if(t.id==='tai_in'){TAI.text=t.value;return}if(t.id&&t.id.startsWith('crit_')){MF.crit=MF.crit||{};MF.crit[t.id.slice(5)]=t.value;return}if(t.dataset&&t.dataset.mf){const[g,k]=t.dataset.mf.split('|');MF[g][k]=+t.value;const l=document.getElementById('wv_'+k);if(l)l.textContent=t.value;return}if(t.type==='file'||!(t.dataset.g2inc||t.dataset.yp||t.dataset.ypr||t.dataset.in||t.dataset.rv||t.dataset.risk||t.dataset.over||t.dataset.lab||t.dataset.rd||t.dataset.cp||t.dataset.val))return;
  if(pendingField&&pendingField.target!==t){clearTimeout(inT);const p=pendingField;pendingField=null;onField(p)}
  pendingField={target:t};syncUI();clearTimeout(inT);inT=setTimeout(()=>{const p=pendingField;pendingField=null;if(p)onField(p)},500)});
function flushField(){if(pendingField){clearTimeout(inT);const p=pendingField;pendingField=null;onField(p)}}
function flushNow(){if(pendingField){clearTimeout(inT);const p=pendingField;pendingField=null;onField(p)}if(dirty.size){clearTimeout(flushT);flush()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushNow()});
window.addEventListener('pagehide',flushNow);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const n=fmt(new Date());if(n!==TODAY){if(cur===TODAY)cur=n;TODAY=n;render()}}});

/* затемнение справа у переключателя — только когда кнопки не помещаются и есть куда листать */
function segFade(){document.querySelectorAll('.seg').forEach(el=>{const upd=()=>{el.classList.toggle('more',el.scrollWidth>el.clientWidth+2);el.classList.toggle('end',el.scrollLeft+el.clientWidth>=el.scrollWidth-4)};upd();el.onscroll=upd})}
window.addEventListener('resize',()=>segFade());
function render(){STEPC=null;
  const started=!!M().start;
  if(!started&&!booted){app.innerHTML='<div class="loading">Загружаю твои данные…</div>';$('#nav').hidden=true;return}
  $('#nav').hidden=!started;
  document.querySelectorAll('nav button[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(started&&cur<M().start)cur=M().start;
  app.innerHTML=!started?viewSetup():tab==='today'?viewToday():tab==='plan'?viewPlan():tab==='health'?viewHealth():viewStats();
  segFade();
  syncUI();
}
render();
boot();
