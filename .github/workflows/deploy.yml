name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

# Выкладка пушем собранного out/ в ветку gh-pages (Pages = Deploy from branch, legacy).
# Старый путь через actions/deploy-pages стабильно падал по таймауту на syncing_files.
# .nojekyll обязателен: без него Jekyll выбрасывает папку _next (CSS/JS) — сайт без стилей.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # вся история: даты изменения страниц в sitemap.xml берутся из git

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # сборка + проверки (postbuild: ссылки, переадресации, SEO, вес); упала проверка — сайт не выкладывается
      - name: Build and check
        run: npm run build

      - name: Deploy to gh-pages
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy-repo
          rsync -a --delete --exclude '.git' --exclude '.nojekyll' out/ deploy-repo/
          touch deploy-repo/.nojekyll
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Выкладка из main @ ${{ github.sha }}"
            git push origin gh-pages
          else
            echo "Изменений нет — выкладка не нужна"
          fi
