<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Анатомия воронки: холод, прогрев, оффер, CTA">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e0e"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,208,0,.14)"/>
      <stop offset="1" stop-color="rgba(255,208,0,.02)"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="rgba(255,208,0,.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="20" y="20" width="1560" height="960" rx="28" fill="url(#panel)" stroke="#1e1e1e"/>
  <rect x="20" y="20" width="1560" height="960" rx="28" fill="url(#grid)" opacity=".5"/>

  <rect x="80" y="66" width="300" height="44" rx="22" fill="rgba(255,208,0,.08)" stroke="rgba(255,208,0,.28)"/>
  <text x="230" y="94" text-anchor="middle" font-family="'Space Mono',monospace" font-size="20" letter-spacing="2" fill="#FFD000">УРОВЕНЬ 3 · МОДЕЛЬ</text>

  <text x="80" y="190" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="62" letter-spacing="-1" fill="#f0ede6">АНАТОМИЯ ВОРОНКИ</text>
  <text x="84" y="242" font-family="'Space Mono',monospace" font-size="24" letter-spacing="1" fill="#7a7670">холод → прогрев → оффер → CTA · путь, который мозг проходит к покупке</text>

  <!-- 1 ХОЛОД -->
  <path d="M270,290 L1330,290 L1220,440 L380,440 Z" fill="url(#funnel)" stroke="rgba(255,208,0,.4)" stroke-width="2"/>
  <text x="800" y="344" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="34" fill="#FFD000">ХОЛОД</text>
  <text x="800" y="384" text-anchor="middle" font-family="'Manrope',sans-serif" font-size="20" fill="#b0aca5">захват внимания</text>

  <!-- 2 ПРОГРЕВ -->
  <path d="M380,460 L1220,460 L1110,610 L490,610 Z" fill="url(#funnel)" stroke="rgba(255,208,0,.4)" stroke-width="2"/>
  <text x="800" y="514" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="34" fill="#FFD000">ПРОГРЕВ</text>
  <text x="800" y="554" text-anchor="middle" font-family="'Manrope',sans-serif" font-size="20" fill="#b0aca5">вовлечение</text>

  <!-- 3 ОФФЕР -->
  <path d="M490,630 L1110,630 L1010,780 L590,780 Z" fill="url(#funnel)" stroke="rgba(255,208,0,.4)" stroke-width="2"/>
  <text x="800" y="684" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="34" fill="#FFD000">ОФФЕР</text>
  <text x="800" y="724" text-anchor="middle" font-family="'Manrope',sans-serif" font-size="20" fill="#b0aca5">снятие страха</text>

  <!-- 4 CTA -->
  <path d="M590,800 L1010,800 L940,930 L660,930 Z" fill="url(#funnel)" stroke="rgba(255,208,0,.55)" stroke-width="2"/>
  <text x="800" y="850" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="32" fill="#FFD000">CTA</text>
  <text x="800" y="890" text-anchor="middle" font-family="'Manrope',sans-serif" font-size="20" fill="#b0aca5">действие</text>

  <!-- правая колонка: элементы + метрика -->
  <g text-anchor="end">
    <text x="1505" y="346" font-family="'Manrope',sans-serif" font-size="20" fill="#b0aca5">заголовок · визуал · реклама</text>
    <text x="1505" y="378" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.8)">CTR · время на странице</text>

    <text x="1505" y="516" font-family="'Manrope',sans-serif" font-size="20" fill="#b0aca5">контент · письма · квиз</text>
    <text x="1505" y="548" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.8)">Open Rate · доходимость</text>

    <text x="1505" y="686" font-family="'Manrope',sans-serif" font-size="20" fill="#b0aca5">кейсы · FOMO · доказательство</text>
    <text x="1505" y="718" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.8)">конверсия в заявку</text>

    <text x="1505" y="852" font-family="'Manrope',sans-serif" font-size="20" fill="#b0aca5">одна кнопка · без трения</text>
    <text x="1505" y="884" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.8)">заявка ✓</text>
  </g>

  <!-- стрелки между этапами -->
  <g stroke="#FFD000" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M240,398 l-10,-12 m10,12 l10,-12"/>
    <path d="M240,568 l-10,-12 m10,12 l10,-12"/>
    <path d="M240,748 l-10,-12 m10,12 l10,-12"/>
  </g>

  <text x="80" y="952" font-family="'Space Mono',monospace" font-size="18" letter-spacing="1" fill="#555">каждый элемент — сигнал · страница — функция · модель — маршрут</text>
</svg>
