<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-label="Шесть стимулов сильного креатива">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e0e"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="rgba(255,208,0,.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="20" y="20" width="1560" height="1040" rx="28" fill="url(#panel)" stroke="#1e1e1e"/>
  <rect x="20" y="20" width="1560" height="1040" rx="28" fill="url(#grid)" opacity=".5"/>

  <rect x="80" y="66" width="260" height="44" rx="22" fill="rgba(255,208,0,.08)" stroke="rgba(255,208,0,.28)"/>
  <text x="210" y="94" text-anchor="middle" font-family="'Space Mono',monospace" font-size="20" letter-spacing="2" fill="#FFD000">ГЛ. 4 · НЕЙРО-ТРАФИК</text>

  <text x="80" y="196" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="62" letter-spacing="-1" fill="#f0ede6">ШЕСТЬ СТИМУЛОВ</text>
  <text x="84" y="248" font-family="'Space Mono',monospace" font-size="24" letter-spacing="1" fill="#7a7670">на что мозг реагирует раньше, чем включается анализ</text>

  <!-- карточка -->
  <g font-family="'Manrope',sans-serif">
    <!-- 1 Визуальный -->
    <rect x="40" y="300" width="500" height="350" rx="20" fill="#101010" stroke="#1e1e1e"/>
    <text x="72" y="366" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="64" fill="none" stroke="rgba(255,208,0,.35)" stroke-width="1.5">01</text>
    <text x="72" y="430" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="34" fill="#FFD000">ВИЗУАЛЬНЫЙ</text>
    <text x="72" y="468" font-family="'Space Mono',monospace" font-size="21" fill="#b0aca5">«Я это вижу»</text>
    <text x="72" y="512" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">картинка считывается раньше текста</text>
    <text x="72" y="546" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">лица крупным планом · контраст · движение</text>
    <text x="72" y="600" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.7)">слабый визуал убивает даже сильный оффер</text>

    <!-- 2 Материальный -->
    <rect x="550" y="300" width="500" height="350" rx="20" fill="#101010" stroke="#1e1e1e"/>
    <text x="582" y="366" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="64" fill="none" stroke="rgba(255,208,0,.35)" stroke-width="1.5">02</text>
    <text x="582" y="430" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="34" fill="#FFD000">МАТЕРИАЛЬНЫЙ</text>
    <text x="582" y="468" font-family="'Space Mono',monospace" font-size="21" fill="#b0aca5">«Я могу это взять»</text>
    <text x="582" y="512" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">эффект предварительного владения</text>
    <text x="582" y="546" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">билет · книга · ключ · коробка</text>
    <text x="582" y="600" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.7)">PDF должен выглядеть как продукт</text>

    <!-- 3 Эго -->
    <rect x="1060" y="300" width="500" height="350" rx="20" fill="#101010" stroke="#1e1e1e"/>
    <text x="1092" y="366" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="64" fill="none" stroke="rgba(255,208,0,.35)" stroke-width="1.5">03</text>
    <text x="1092" y="430" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="34" fill="#FFD000">ЭГО</text>
    <text x="1092" y="468" font-family="'Space Mono',monospace" font-size="21" fill="#b0aca5">«Это про меня»</text>
    <text x="1092" y="512" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">точное попадание в личную карту выгоды</text>
    <text x="1092" y="546" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">не «мы лучшие», а «ты заберёшь контроль»</text>
    <text x="1092" y="600" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.7)">это не лесть, а точность</text>

    <!-- 4 Эмоциональный -->
    <rect x="40" y="670" width="500" height="350" rx="20" fill="#101010" stroke="#1e1e1e"/>
    <text x="72" y="736" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="64" fill="none" stroke="rgba(255,208,0,.35)" stroke-width="1.5">04</text>
    <text x="72" y="800" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="34" fill="#FFD000">ЭМОЦИОНАЛЬНЫЙ</text>
    <text x="72" y="838" font-family="'Space Mono',monospace" font-size="21" fill="#b0aca5">«Я это чувствую»</text>
    <text x="72" y="882" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">эмоция — главное топливо решения</text>
    <text x="72" y="916" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">страх потери · облегчение · предвкушение</text>
    <text x="72" y="970" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.7)">точная эмоция, а не просто громкая</text>

    <!-- 5 Контрастный -->
    <rect x="550" y="670" width="500" height="350" rx="20" fill="#101010" stroke="#1e1e1e"/>
    <text x="582" y="736" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="64" fill="none" stroke="rgba(255,208,0,.35)" stroke-width="1.5">05</text>
    <text x="582" y="800" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="34" fill="#FFD000">КОНТРАСТНЫЙ</text>
    <text x="582" y="838" font-family="'Space Mono',monospace" font-size="21" fill="#b0aca5">«Я вижу разницу»</text>
    <text x="582" y="882" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">сравнение экономит энергию мозга</text>
    <text x="582" y="916" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">до/после · хаос/система · ручное/авто</text>
    <text x="582" y="970" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.7)">решение — всегда рядом с проблемой</text>

    <!-- 6 Память -->
    <rect x="1060" y="670" width="500" height="350" rx="20" fill="#101010" stroke="#1e1e1e"/>
    <text x="1092" y="736" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="64" fill="none" stroke="rgba(255,208,0,.35)" stroke-width="1.5">06</text>
    <text x="1092" y="800" font-family="'Space Grotesk',sans-serif" font-weight="800" font-size="34" fill="#FFD000">ПАМЯТЬ</text>
    <text x="1092" y="838" font-family="'Space Mono',monospace" font-size="21" fill="#b0aca5">«Я это узнаю»</text>
    <text x="1092" y="882" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">эффект простого предъявления</text>
    <text x="1092" y="916" font-family="'Manrope',sans-serif" font-size="22" fill="#7a7670">мемы · культурные коды · жанровые шаблоны</text>
    <text x="1092" y="970" font-family="'Space Mono',monospace" font-size="19" fill="rgba(255,208,0,.7)">особенно силён в соцсетях</text>
  </g>
</svg>
