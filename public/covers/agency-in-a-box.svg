<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="600" height="840" role="img" aria-label="Обложка книги Агентство в коробке, NCAi, Илья Новицкий">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ecdc4"/>
      <stop offset="1" stop-color="#2fa8a0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.30" r="0.62">
      <stop offset="0" stop-color="rgba(78,205,196,0.15)"/>
      <stop offset="1" stop-color="rgba(78,205,196,0)"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="840" fill="url(#bg)"/>
  <rect width="600" height="840" fill="url(#glow)"/>
  <rect width="600" height="840" filter="url(#grain)" opacity="0.6"/>
  <rect x="22" y="22" width="556" height="796" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <rect x="30" y="30" width="540" height="780" fill="none" stroke="rgba(78,205,196,0.30)" stroke-width="1.5"/>
  <!-- коробка-изометрия -->
  <g transform="translate(300,340)" stroke="url(#teal)" fill="none" stroke-width="2.5" opacity="0.9">
    <path d="M0,-120 L140,-60 L140,70 L0,130 L-140,70 L-140,-60 Z"/>
    <path d="M0,-120 L0,130"/>
    <path d="M-140,-60 L0,0 L140,-60"/>
    <path d="M0,0 L0,130"/>
  </g>
  <g transform="translate(300,340)" stroke="rgba(78,205,196,0.45)" fill="none" stroke-width="1.2" stroke-dasharray="2 6">
    <path d="M0,-120 L140,-60 L140,70 L0,130 L-140,70 L-140,-60 Z"/>
    <path d="M0,-120 L0,130"/>
    <path d="M-140,-60 L0,0 L140,-60"/>
  </g>
  <g fill="#4ecdc4" opacity="0.85">
    <circle cx="84" cy="240" r="3"/>
    <circle cx="516" cy="520" r="2.5"/>
    <circle cx="508" cy="196" r="2"/>
    <circle cx="104" cy="610" r="2"/>
  </g>
  <text x="48" y="70" font-family="'Space Mono','JetBrains Mono',monospace" font-size="15" letter-spacing="4" fill="rgba(255,255,255,0.45)">МЕТОДОЛОГИЯ NCAI</text>
  <text x="48" y="782" font-family="'Space Mono','JetBrains Mono',monospace" font-size="15" letter-spacing="3" fill="rgba(255,255,255,0.45)">ИЛЬЯ НОВИЦКИЙ · 2026</text>
  <text x="48" y="650" font-family="'Space Grotesk','Syne',sans-serif" font-size="46" font-weight="800" letter-spacing="-1" fill="#f4f1e8">АГЕНТСТВО</text>
  <text x="48" y="704" font-family="'Space Grotesk','Syne',sans-serif" font-size="46" font-weight="800" letter-spacing="-1" fill="url(#teal)">В КОРОБКЕ</text>
  <text x="48" y="640" font-family="'Manrope','Instrument Serif',sans-serif" font-size="17" fill="rgba(244,241,232,0.55)">SaaS-платформа NCAi: мульти-аренда,</text>
  <text x="48" y="662" font-family="'Manrope','Instrument Serif',sans-serif" font-size="17" fill="rgba(244,241,232,0.55)">распаковка клиента, подписка, автоматизация</text>
  <text x="48" y="690" font-family="'Manrope','Instrument Serif',sans-serif" font-size="17" fill="rgba(244,241,232,0.55)">6 глав · чит-коды · словарь</text>
  <rect x="480" y="92" width="74" height="26" rx="13" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="517" y="110" font-family="'Space Mono','JetBrains Mono',monospace" font-size="13" text-anchor="middle" fill="#4ecdc4">NCAi</text>
</svg>
